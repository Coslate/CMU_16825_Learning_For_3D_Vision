seed: 1
type: train_nerf
training:
  num_epochs: 500
  batch_size: 1024
  lr: 5.0e-06
  lr_scheduler_step_size: 50
  lr_scheduler_gamma: 0.8
  checkpoint_path: ./no_use_vies_checkpoints
  checkpoint_interval: 50
  resume: true
  render_interval: 10
data:
  image_size:
  - 128
  - 128
  dataset_name: lego
renderer:
  type: volume
  chunk_size: 32768
  white_background: false
sampler:
  type: stratified
  n_pts_per_ray: 128
  min_depth: 2.0
  max_depth: 6.0
implicit_function:
  type: nerf
  use_views: false
  n_harmonic_functions_xyz: 6
  n_harmonic_functions_dir: 2
  n_hidden_neurons_xyz: 256
  n_hidden_neurons_dir: 128
  density_noise_std: 0.0
  n_layers_xyz: 8
  append_xyz:
  - 3
