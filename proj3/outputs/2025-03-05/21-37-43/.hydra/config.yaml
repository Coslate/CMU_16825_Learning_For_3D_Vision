seed: 1
type: train_nerf
output_gif_file: ./images/part_4_2.nerf_materials_highres.use_views.use_coarse_fine50.gif
training:
  num_epochs: 200
  batch_size: 1024
  lr: 0.0001
  lr_scheduler_step_size: 50
  lr_scheduler_gamma: 0.8
  checkpoint_path: ./checkpoints.q4_2.nerf_materials_highres.use_views.use_coarse_fine50
  checkpoint_interval: 50
  resume: true
  render_interval: 10
data:
  image_size:
  - 400
  - 400
  dataset_name: materials
renderer:
  type: volume
  chunk_size: 32768
  white_background: false
sampler:
  type: coarse_fine
  n_pts_per_ray: 256
  min_depth: 1.0
  max_depth: 7.0
  n_coarse_pts_per_ray: 128
  n_fine_pts_per_ray: 170
  use_fine_sampling: true
implicit_function:
  type: nerf
  use_views: true
  n_harmonic_functions_xyz: 10
  n_harmonic_functions_dir: 3
  n_hidden_neurons_xyz: 192
  n_hidden_neurons_dir: 96
  density_noise_std: 0.0
  n_layers_xyz: 8
  append_xyz:
  - 3
