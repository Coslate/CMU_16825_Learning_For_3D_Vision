seed: 1

#few_views: 20 #For 8.2
#few_views: 12 #For 8.2
#few_views: 10 #For 8.2
#few_views: 7 #For 8.2
#few_views: 5 #For 8.2

type: train_nerf
output_gif_file: ./images/part_3.nerf_lego.gif
#output_gif_file: ./images/part_4_1.nerf_lego.use_views.gif
#output_gif_file: ./images/part_3.nerf_lego_few_views20.gif #For Q8.2
#output_gif_file: ./images/part_3.nerf_lego_few_views12.gif #For Q8.2
#output_gif_file: ./images/part_3.nerf_lego_few_views10.gif #For Q8.2
#output_gif_file: ./images/part_3.nerf_lego_few_views7.gif #For Q8.2
#output_gif_file: ./images/part_3.nerf_lego_few_views5.gif #For Q8.2

training:
  num_epochs: 250
  batch_size: 1024
  #lr: 0.000005
  lr: 0.0005

  lr_scheduler_step_size: 50
  lr_scheduler_gamma: 0.8

  checkpoint_path: ./checkpoints.q3.nerf_lego
  #checkpoint_path: ./checkpoints.q4_1.nerf_lego.use_views
  #checkpoint_path: ./checkpoints.q3.nerf_lego.few_views20
  #checkpoint_path: ./checkpoints.q3.nerf_lego.few_views12
  #checkpoint_path: ./checkpoints.q3.nerf_lego.few_views10
  #checkpoint_path: ./checkpoints.q3.nerf_lego.few_views7
  #checkpoint_path: ./checkpoints.q3.nerf_lego.few_views5
  checkpoint_interval: 50
  resume: True

  render_interval: 10

data:
  image_size: [128, 128]
  dataset_name: lego

renderer:
  type: volume
  chunk_size: 32768
  white_background: False

sampler:
  type: stratified
  n_pts_per_ray: 256

  min_depth: 2.0
  max_depth: 6.0

implicit_function:
  type: nerf

  use_views: False
  #use_views: True
  n_harmonic_functions_xyz: 10
  n_harmonic_functions_dir: 2
  n_hidden_neurons_xyz: 256
  n_hidden_neurons_dir: 128
  density_noise_std: 0.0
  n_layers_xyz: 8
  append_xyz: [3]


